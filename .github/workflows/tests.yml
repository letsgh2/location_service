# .github/workflows/tests.yml
# Uruchamia testy backendu (pytest) przy każdym push i pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  ci-ok:
    name: ci-ok
    needs: [backend-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful test jobs
        env:
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: test "$BACKEND_TESTS_RESULT" = "success"

# .github/workflows/tests.yml
# Uruchamia testy backendu (pytest) z pomiarem pokrycia kodu przy każdym push i pull request.
# Pokrycie (linie + gałęzie) poniżej 80% kończy workflow błędem.
name: Tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests with coverage
        run: >
          pytest -q
          --cov
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14
